<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="本机项目是唯一来源：复制到 Clash 现场，脱敏同步到分享包；环境卫士调用本机脚本，只读部署清单">
  <title>Claude 环境三处关系</title>
  <defs>
    <style>
      .t { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
      .m { font-family: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, monospace; }
      .b { font-size: 16px; font-weight: 700; fill: #2b2622; }
      .s { font-size: 13px; fill: #5a5148; }
      .hl { font-size: 18px; font-weight: 700; fill: #a34e2a; }
      .note { font-size: 13px; font-weight: 700; fill: #a34e2a; }
      .note2 { font-size: 13px; fill: #5a5148; }
      .box { fill: #fffdfa; stroke: #d3cbbf; stroke-width: 1.4; }
      .src { fill: #f7ebe3; stroke: #a34e2a; stroke-width: 2; }
      .ok { fill: #eef3ec; stroke: #8fab96; stroke-width: 1.5; }
      .f { stroke: #b5aca2; stroke-width: 1.8; fill: none; }
      .fo { stroke: #a34e2a; stroke-width: 2.4; fill: none; }
      .ma { fill: #b5aca2; } .mo { fill: #a34e2a; }
      .dot { fill: #a34e2a; }
      .dotg { fill: #857b70; }
      @media (prefers-reduced-motion: reduce) { .dot, .dotg { display: none; } }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ma"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mo"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#fffdfa"/>

  <rect x="20" y="130" width="170" height="90" rx="12" class="box"/>
  <text x="105" y="168" text-anchor="middle" class="t b">外部信息</text>
  <text x="105" y="194" text-anchor="middle" class="t s">博主、官方文档</text>

  <rect x="360" y="84" width="260" height="182" rx="14" class="src"/>
  <text x="490" y="124" text-anchor="middle" class="t hl">本机项目</text>
  <text x="490" y="150" text-anchor="middle" class="t s">唯一来源</text>
  <text x="490" y="192" text-anchor="middle" class="t b" style="font-size:14px">规则只在 JS</text>
  <text x="490" y="216" text-anchor="middle" class="t b" style="font-size:14px">网段只在防火墙脚本</text>
  <text x="490" y="240" text-anchor="middle" class="t b" style="font-size:14px">规则表和图由脚本填入</text>

  <rect x="760" y="20" width="220" height="88" rx="12" class="box"/>
  <text x="870" y="56" text-anchor="middle" class="t b">Clash Verge 现场</text>
  <text x="870" y="82" text-anchor="middle" class="t s">你点重载才生效</text>

  <rect x="760" y="130" width="220" height="88" rx="12" class="ok"/>
  <text x="870" y="166" text-anchor="middle" class="m b">claude-env-share</text>
  <text x="870" y="192" text-anchor="middle" class="t s">分享包，脱敏副本</text>

  <rect x="760" y="240" width="220" height="88" rx="12" class="ok"/>
  <text x="870" y="276" text-anchor="middle" class="m b">ClaudeEnvGuard</text>
  <text x="870" y="302" text-anchor="middle" class="t s">环境卫士，你的日常入口</text>

  <rect x="360" y="312" width="260" height="68" rx="12" class="box"/>
  <text x="490" y="342" text-anchor="middle" class="t b">部署清单</text>
  <text x="490" y="364" text-anchor="middle" class="t s">本机端口和路径记在这</text>

  <path d="M190,175 H358" class="fo" marker-end="url(#o)"/>
  <text x="274" y="162" text-anchor="middle" class="t note">AI 对比，你确认</text>
  <path d="M620,130 C680,130 700,64 758,64" class="fo" marker-end="url(#o)"/>
  <text x="664" y="84" text-anchor="middle" class="t note">复制</text>
  <path d="M620,174 H758" class="fo" marker-end="url(#o)"/>
  <text x="690" y="164" text-anchor="middle" class="t note">脱敏同步</text>
  <path d="M758,284 C700,284 680,224 622,224" class="f" marker-end="url(#a)"/>
  <text x="664" y="274" text-anchor="middle" class="t note2">调用脚本</text>
  <path d="M490,266 V310" class="f" marker-end="url(#a)"/>
  <text x="500" y="294" class="t note2">总检写</text>
  <path d="M870,328 V346 H622" class="f" marker-end="url(#a)"/>
  <text x="746" y="338" text-anchor="middle" class="t note2">卫士只读</text>

  <circle r="5.5" class="dot"><animateMotion dur="2.6s" repeatCount="indefinite" path="M190,175 H358"/></circle>
  <circle r="5.5" class="dot"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.5s" path="M620,130 C680,130 700,64 758,64"/></circle>
  <circle r="5.5" class="dot"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1s" path="M620,174 H758"/></circle>
  <circle r="4.5" class="dotg"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.2s" path="M758,284 C700,284 680,224 622,224"/></circle>
</svg>
